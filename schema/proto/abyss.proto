syntax = "proto3";

package protobyss;

option go_package = "./protobyss";

message ACPContainer {
  int32 type_id = 1;
  string message_id = 2;
  string response_for = 3;
  bytes content = 4;
}

// go:plugin type=plugin version=1
service ACPPlugin {
  rpc HandleStream(stream ACPContainer) returns (stream ACPContainer);
}
