# https://taskfile.dev

version: "3"

tasks:
  build:
    deps:
      - build-docker
      - binary:build
  site:
    dir: site
    cmds:
      - npm install
      - npm run dev
  puml:
    sources:
      - "**/*.puml"
    cmds:
      - ./scripts/build-diagrams.sh
  build-docker:
    cmds:
      - ./abyss docker gc
      - ./scripts/build-push-docker.sh
  todo:
    cmds:
      - rg 'TODO'
  install-hooks:
    cmds:
      - cp scripts/git-hooks/* .git/hooks/
      - chmod +x .git/hooks/*
  logs:
    cmds:
      - less -f "$HOME/.local/var/abyss/log/$(ls -lt ~/.local/var/abyss/log/ | sed -sn 2p | awk '{print $9}')"

includes:
  binary:
    taskfile: ./build/taskfiles/binary.yaml
