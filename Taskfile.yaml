# https://taskfile.dev

version: "3"

tasks:
  build:
    desc: Meta-task for building the binary and Pi Docker image
    summary: |
      Builds the binary and Pi Docker image.
    deps:
      - build-docker
      - binary:build
  site:
    desc: Starts the dev server for the site
    summary: |
      Starts the dev server for the site.
    dir: site
    cmds:
      - npm install
      - npm run dev
  puml:
    desc: Builds all PlantUML files into images
    summary: |
      Builds all PlantUML files into images.
    sources:
      - "**/*.puml"
    cmds:
      - ./scripts/build-diagrams.sh
  build-docker:
    desc: Builds the Docker image
    summary: |
      Builds the Docker image.
    cmds:
      - ./abyss docker gc
      - ./scripts/build-push-docker.sh -i base
      - ./scripts/build-push-docker.sh -i base-js
      - ./scripts/build-push-docker.sh -i pi
  todo:
    desc: Finds TODO items in the code
    summary: |
      Finds TODO items in the code.
    cmds:
      - rg 'TODO'
  install-hooks:
    desc: Installs Git hooks
    summary: |
      Installs Git hooks.
    cmds:
      - cp scripts/git-hooks/* .git/hooks/
      - chmod +x .git/hooks/*
  logs:
    desc: Shows the host logs for the most recent run
    summary: |
      Shows the logs.
    cmds:
      - less -f "$HOME/.local/var/abyss/log/$(ls -lt ~/.local/var/abyss/log/ | sed -sn 2p | awk '{print $9}')"

includes:
  binary:
    taskfile: ./build/taskfiles/binary.yaml
  docker:
    taskfile: ./build/taskfiles/docker.yaml
